          - worker: 61
            role: hunt
          - worker: 62
            role: hunt
          - worker: 63
            role: hunt
          - worker: 64
            role: hunt
          - worker: 65
            role: hunt
          - worker: 66
            role: hunt
          - worker: 67
            role: hunt
          - worker: 68
            role: hunt
          - worker: 69
            role: hunt
          - worker: 70
            role: hunt
          - worker: 71
            role: hunt
          - worker: 72
            role: hunt
          - worker: 73
            role: hunt
          - worker: 74
            role: hunt
          - worker: 75
            role: hunt
          - worker: 76
            role: hunt
          - worker: 77
            role: hunt
          - worker: 78
            role: hunt
          - worker: 79
            role: hunt
          - worker: 80
            role: hunt
    name: ${{ matrix.role }} (${{ matrix.worker }})
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run ${{ matrix.role }} worker ${{ matrix.worker }}
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB: ${{ secrets.MONGODB_DB || 'test' }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT || github.token }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_JOB: ${{ matrix.role }}-worker-${{ matrix.worker }}
          HUNT_WORKER_NUM: ${{ matrix.worker }}
          HUNT_ENABLED: ${{ secrets.HUNT_ENABLED }}
          WORKER_ROLE: ${{ matrix.role }}
        run: |
          MAX_H="${{ github.event.inputs.max_hours || '5.5' }}"
          MAX_S=$(python -c "print(int(float('$MAX_H') * 3600))")
          ROLE="${{ matrix.role }}"
          echo "Starting role=$ROLE worker=${{ matrix.worker }} HUNT_ENABLED=${HUNT_ENABLED:-unset} (max ${MAX_S}s)..."
          if [ "$ROLE" = "hunt" ]; then
            python -c "
          from src.hunt_loop import run_loop
          run_loop(max_runtime_seconds=$MAX_S, idle_sleep=5)
          "
          else
            python -c "
          from src.processor import run_loop
          run_loop(max_runtime_seconds=$MAX_S, idle_sleep=3)
          "
          fi

      - name: Status summary
        if: always()
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB: ${{ secrets.MONGODB_DB || 'test' }}
        run: |
          python -c "
          try:
              from src import db
              print('Extract queue:', db.count_by_status())
          except Exception as e:
              print('Extract status skip:', e)
          try:
              from src import hunt_db
              print('Hunt status:', hunt_db.hunt_stats())
          except Exception as e:
              print('Hunt status skip:', e)
          "
