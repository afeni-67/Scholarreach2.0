name: Scholarreach Processor

on:
  # Render wake only (every ~2 min). Single workflow:
  # 40 extract (custom journals) + 40 hunt (topic+email) = 80 matrix jobs.
  workflow_dispatch:
    inputs:
      max_hours:
        description: "Max runtime hours for this run (default 5.5)"
        required: false
        default: "5.5"
  repository_dispatch:
    types: [enqueue, process]

# Render wakeWorkers caps at 2 active workflow runs (Wave A + Wave B @ +3h).
# Free-tier concurrent jobs may queue past ~20 slots (GitHub account limit).

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - worker: 1
            role: extract
          - worker: 2
            role: extract
          - worker: 3
            role: extract
          - worker: 4
            role: extract
          - worker: 5
            role: extract
          - worker: 6
            role: extract
          - worker: 7
            role: extract
          - worker: 8
            role: extract
          - worker: 9
            role: extract
          - worker: 10
            role: extract
          - worker: 11
            role: extract
          - worker: 12
            role: extract
          - worker: 13
            role: extract
          - worker: 14
            role: extract
          - worker: 15
            role: extract
          - worker: 16
            role: extract
          - worker: 17
            role: extract
          - worker: 18
            role: extract
          - worker: 19
            role: extract
          - worker: 20
            role: extract
          - worker: 21
            role: extract
          - worker: 22
            role: extract
          - worker: 23
            role: extract
          - worker: 24
            role: extract
          - worker: 25
            role: extract
          - worker: 26
            role: extract
          - worker: 27
            role: extract
          - worker: 28
            role: extract
          - worker: 29
            role: extract
          - worker: 30
            role: extract
          - worker: 31
            role: extract
          - worker: 32
            role: extract
          - worker: 33
            role: extract
          - worker: 34
            role: extract
          - worker: 35
            role: extract
          - worker: 36
            role: extract
          - worker: 37
            role: extract
          - worker: 38
            role: extract
          - worker: 39
            role: extract
          - worker: 40
            role: extract
          - worker: 41
            role: hunt
          - worker: 42
            role: hunt
          - worker: 43
            role: hunt
          - worker: 44
            role: hunt
          - worker: 45
            role: hunt
          - worker: 46
            role: hunt
          - worker: 47
            role: hunt
          - worker: 48
            role: hunt
          - worker: 49
            role: hunt
          - worker: 50
            role: hunt
          - worker: 51
            role: hunt
          - worker: 52
            role: hunt
          - worker: 53
            role: hunt
          - worker: 54
            role: hunt
          - worker: 55
            role: hunt
          - worker: 56
            role: hunt
          - worker: 57
