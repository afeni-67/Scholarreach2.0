name: Scholarreach Processor

on:
  # Render wake only (every ~2 min). Single workflow: extract + hunt labels.
  workflow_dispatch:
    inputs:
      max_hours:
        description: "Max runtime hours for this run (default 5.5)"
        required: false
        default: "5.5"
  repository_dispatch:
    types: [enqueue, process]

# Max 2 active runs via Render wakeWorkers. One matrix of 20 jobs:
# workers 1–18 = custom-journal extract, 19–20 = hunt (topic+email).
# No separate hunt.yml dispatch → no extra queue storm.

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- extract fleet (custom journals) ---
          - worker: 1
            role: extract
          - worker: 2
            role: extract
          - worker: 3
            role: extract
          - worker: 4
            role: extract
          - worker: 5
            role: extract
          - worker: 6
            role: extract
          - worker: 7
            role: extract
          - worker: 8
            role: extract
          - worker: 9
            role: extract
          - worker: 10
            role: extract
          - worker: 11
            role: extract
          - worker: 12
            role: extract
          - worker: 13
            role: extract
          - worker: 14
            role: extract
          - worker: 15
            role: extract
          - worker: 16
            role: extract
          - worker: 17
            role: extract
          - worker: 18
            role: extract
          # --- hunt fleet (topic + email pool) ---
          - worker: 19
            role: hunt
          - worker: 20
            role: hunt
    name: ${{ matrix.role }} (${{ matrix.worker }})
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run ${{ matrix.role }} worker ${{ matrix.worker }}
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB: ${{ secrets.MONGODB_DB || 'test' }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT || github.token }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_JOB: ${{ matrix.role }}-worker-${{ matrix.worker }}
          HUNT_WORKER_NUM: ${{ matrix.worker }}
          HUNT_ENABLED: ${{ secrets.HUNT_ENABLED }}
          WORKER_ROLE: ${{ matrix.role }}
        run: |
          MAX_H="${{ github.event.inputs.max_hours || '5.5' }}"
          MAX_S=$(python -c "print(int(float('$MAX_H') * 3600))")
          ROLE="${{ matrix.role }}"
          echo "Starting role=$ROLE worker=${{ matrix.worker }} HUNT_ENABLED=${HUNT_ENABLED:-unset} (max ${MAX_S}s)..."
          if [ "$ROLE" = "hunt" ]; then
            python -c "
          from src.hunt_loop import run_loop
          run_loop(max_runtime_seconds=$MAX_S, idle_sleep=5)
          "
          else
            python -c "
          from src.processor import run_loop
          run_loop(max_runtime_seconds=$MAX_S, idle_sleep=3)
          "
          fi

      - name: Status summary
        if: always()
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB: ${{ secrets.MONGODB_DB || 'test' }}
        run: |
          python -c "
          try:
              from src import db
              print('Extract queue:', db.count_by_status())
          except Exception as e:
              print('Extract status skip:', e)
          try:
              from src import hunt_db
              print('Hunt status:', hunt_db.hunt_stats())
          except Exception as e:
              print('Hunt status skip:', e)
          "
